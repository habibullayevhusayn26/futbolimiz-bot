<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Futbol jonli hisoblari</title>
  <link rel="stylesheet" href="/mini-app/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/mini-app/app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">FUTBOLIMIZ UZ</p>
        <h1>Futbol olami</h1>
      </div>
      <button class="refresh-button" id="refresh-button" type="button" aria-label="Yangilash">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3L3 11m0 0V5m0 6h6m-5 2a8 8 0 0 0 14.9 3L21 13m0 0v6m0-6h-6"/></svg>
      </button>
    </header>

    <section class="live-banner" aria-label="Jonli o'yinlar">
      <span class="live-dot"></span>
      <span>Jonli hisoblar</span>
      <span class="live-count" id="live-count">0</span>
    </section>

    <section class="view-tabs" aria-label="Bo‘limni tanlang">
      <button class="view-tab active" data-view="matches" type="button" aria-pressed="true">O‘yinlar</button>
      <button class="view-tab" data-view="standings" type="button" aria-pressed="false">Turnir jadvali</button>
    </section>

    <section class="controls" aria-label="O'yinlarni saralash">
      <div class="match-controls" id="match-controls">
        <div class="filter-tabs" role="tablist" aria-label="O'yin holati">
          <button class="filter-tab active" data-filter="all" type="button">Barchasi</button>
          <button class="filter-tab" data-filter="in" type="button">Jonli</button>
          <button class="filter-tab" data-filter="pre" type="button">Jadval</button>
          <button class="filter-tab" data-filter="post" type="button">Natijalar</button>
        </div>
        <div class="selection-row">
          <button class="date-step" id="previous-day" type="button" aria-label="Oldingi kun">‹</button>
          <input id="match-date" type="date" aria-label="O'yin sanasi">
          <button class="date-step" id="next-day" type="button" aria-label="Keyingi kun">›</button>
          <button class="today-button" id="today-button" type="button">Bugun</button>
        </div>
      </div>
      <div class="league-select-wrap">
        <span class="league-filter-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 4.8 2 3.1-2 2.2.9 3.3-2.5 1.1M16.8 6l-2.7 1.2.5 2.6 3.4 1.5 2.4-1.3M9.4 20.5l.7-3.2 3-1.7 2.8 1.1.8 3.4"/></svg>
        </span>
        <span class="league-filter-copy">
          <span class="league-filter-caption">MUSOBAQA FILTRI</span>
          <button
            class="league-filter-trigger"
            id="league-select-button"
            type="button"
            aria-label="Musobaqani tanlang"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="league-options"
          >
            <span id="league-select-label">Barcha musobaqalar</span>
            <svg class="league-filter-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
          </button>
        </span>
        <span class="league-filter-count" id="league-filter-count">6 LIGA</span>
        <div class="league-options" id="league-options" role="listbox" aria-label="Musobaqani tanlang" hidden></div>
      </div>
    </section>

    <div class="status-message" id="status-message" role="status" aria-live="polite"></div>
    <div class="standings-season" id="standings-season" hidden></div>
    <section class="match-list" id="match-list" aria-label="Futbol o'yinlari"></section>

    <footer class="footer">
      <span>Ma'lumotlar ESPN'dan</span>
      <span id="updated-at"></span>
    </footer>
  </main>
</body>
</html>
