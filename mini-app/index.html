<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Futbol jonli hisoblari</title>
  <link rel="icon" type="image/png" href="/mini-app/logo.png">
  <link rel="stylesheet" href="/mini-app/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js" defer></script>
  <script src="/mini-app/app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="/mini-app/logo.png" alt="Futbolimiz UZ logotipi">
      </div>
      <button class="refresh-button" id="refresh-button" type="button" aria-label="Yangilash">
        <span class="svg-icon" style="--svg-icon:url('/mini-app/icons/refresh-cw.svg')" aria-hidden="true"></span>
      </button>
      <button class="profile-button" id="profile-button" type="button" aria-label="Profilni ochish" title="Profil">
        <span class="svg-icon" style="--svg-icon:url('/mini-app/icons/user-round.svg')" aria-hidden="true"></span>
      </button>
    </header>

    <div id="dashboard-view">
    <section class="live-banner" aria-label="Jonli o'yinlar">
      <span class="live-dot"></span>
      <span>Jonli hisoblar</span>
      <span class="live-count" id="live-count">0</span>
    </section>

    <section class="view-tabs" aria-label="Bo‘limni tanlang">
      <button class="view-tab active" data-view="matches" type="button" aria-pressed="true">O‘yinlar</button>
      <button class="view-tab" data-view="standings" type="button" aria-pressed="false">Turnir jadvali</button>
      <button class="view-tab" data-view="stream" type="button" aria-pressed="false">Jonli efir</button>
    </section>
    <div class="notification-hint" id="notification-hint" role="status" aria-live="polite"></div>

    <section class="controls" aria-label="O'yinlarni saralash">
      <div class="match-controls" id="match-controls">
        <div class="filter-tabs" role="tablist" aria-label="O'yin holati">
          <button class="filter-tab active" data-filter="all" type="button">Barchasi</button>
          <button class="filter-tab" data-filter="in" type="button">Jonli</button>
          <button class="filter-tab" data-filter="pre" type="button">Jadval</button>
          <button class="filter-tab" data-filter="post" type="button">Natijalar</button>
        </div>
        <div class="selection-row">
          <button class="date-step" id="previous-day" type="button" aria-label="Oldingi kun"><span class="svg-icon" style="--svg-icon:url('/mini-app/icons/chevron-left.svg')" aria-hidden="true"></span></button>
          <input id="match-date" type="date" aria-label="O'yin sanasi">
          <button class="date-step" id="next-day" type="button" aria-label="Keyingi kun"><span class="svg-icon" style="--svg-icon:url('/mini-app/icons/chevron-right.svg')" aria-hidden="true"></span></button>
          <button class="today-button" id="today-button" type="button">Bugun</button>
        </div>
      </div>
      <div class="league-select-wrap">
        <span class="league-filter-icon" aria-hidden="true">
          <span class="svg-icon" style="--svg-icon:url('/mini-app/icons/ball-football.svg')"></span>
        </span>
        <span class="league-filter-copy">
          <span class="league-filter-caption">MUSOBAQA FILTRI</span>
          <button
            class="league-filter-trigger"
            id="league-select-button"
            type="button"
            aria-label="Musobaqani tanlang"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="league-options"
          >
            <span id="league-select-label">Barcha musobaqalar</span>
            <span class="svg-icon league-filter-chevron" style="--svg-icon:url('/mini-app/icons/chevron-down.svg')" aria-hidden="true"></span>
          </button>
        </span>
        <span class="league-filter-count" id="league-filter-count">6 LIGA</span>
        <div class="league-options" id="league-options" role="listbox" aria-label="Musobaqani tanlang" hidden></div>
      </div>
    </section>

    <div class="status-message" id="status-message" role="status" aria-live="polite"></div>
    <div class="standings-season" id="standings-season" hidden></div>
    <section class="match-list" id="match-list" aria-label="Futbol o'yinlari"></section>
    <section class="live-stream-view" id="live-stream-view" aria-label="Jonli efir" hidden></section>

    <footer class="footer">
      <span>Ma'lumotlar ESPN'dan</span>
      <span id="updated-at"></span>
    </footer>
    </div>

    <section class="match-detail" id="match-detail" aria-live="polite" hidden>
      <div class="detail-topline">
        <button class="detail-back-button" id="detail-back-button" type="button" aria-label="O‘yinlarga qaytish"><span class="svg-icon" style="--svg-icon:url('/mini-app/icons/chevron-left.svg')" aria-hidden="true"></span></button>
        <span class="detail-live-badge" id="detail-live-badge"></span>
        <button class="detail-close-button" id="detail-close-button" type="button" aria-label="O‘yinni yopish"><span class="svg-icon" style="--svg-icon:url('/mini-app/icons/x.svg')" aria-hidden="true"></span></button>
      </div>
      <div id="match-detail-content"></div>
    </section>

    <section class="profile-view" id="profile-view" aria-live="polite" hidden>
      <div class="profile-topline">
        <button class="detail-back-button" id="profile-back-button" type="button" aria-label="Asosiy sahifaga qaytish"><span class="svg-icon" style="--svg-icon:url('/mini-app/icons/chevron-left.svg')" aria-hidden="true"></span></button>
        <button class="profile-theme-button" id="profile-theme-button" type="button" aria-label="Mavzu: Avto" title="Mavzu: Avto"></button>
        <h1>Profil</h1>
      </div>
      <div id="profile-content"></div>
    </section>
  </main>
</body>
</html>
